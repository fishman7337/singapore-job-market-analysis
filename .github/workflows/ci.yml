name: CI

on:
  pull_request:
  push:
    branches: ["main", "codex/**"]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src scripts tests

      - name: Compile
        run: python -m compileall src scripts tests

      - name: Test
        run: pytest

      - name: Security scan
        run: bandit -r src scripts -c pyproject.toml

      - name: Dependency vulnerability audit
        run: pip-audit --requirement requirements.txt

      - name: Verify split notebooks
        run: python scripts/split_notebook.py --verify

      - name: DataOps smoke check
        run: python -m sg_job_market_analysis.dataops --allow-missing
