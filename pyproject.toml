[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singapore-graduate-employment-analytics"
version = "1.0.0"
description = "Data analysis utilities and documentation for Singapore graduate employment and labour market trends."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Goh Kun Ming" }, { name = "Goh Jenson" }]
dependencies = [
    "matplotlib>=3.7",
    "nltk>=3.8",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "plotly>=5.18",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7",
    "jupyter>=1.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

[project.scripts]
sg-job-market-dataops = "sg_job_market_analysis.dataops:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=sg_job_market_analysis --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
